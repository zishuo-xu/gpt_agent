name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager（pnpm@10.x），避免与 action 显式 version 冲突
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Test
        run: pnpm test

      - name: Deterministic harness eval
        run: pnpm eval

  # Web E2E（非模型场景）：服务器由 playwright webServer 自动启动（隔离 HOME 与工作区）。
  # 需要真实模型调用的用例（只读任务 / 写文件审批流 / 导出会话等模型回复）无 API Key
  # 无法在 CI 运行，通过 --grep-invert 排除，由本地手工回归覆盖（prod-scenarios 同理）。
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # 版本取自 package.json 的 packageManager（pnpm@10.x），避免与 action 显式 version 冲突
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Install Playwright chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Prepare e2e workspace
        run: mkdir -p /tmp/myagent-gui-test-workspace

      - name: Run e2e (non-model scenarios)
        run: pnpm exec playwright test --config web/playwright.config.ts --grep-invert "只读任务|写文件触发审批|导出会话为 HTML"
