name: MyAgent AI Review

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, labeled]

concurrency:
  group: myagent-ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    if: >-
      github.event.pull_request.draft == false &&
      (
        contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.pull_request.author_association) ||
        contains(github.event.pull_request.labels.*.name, 'ai-review')
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # pull_request_target can access repository secrets. Always check out the
      # trusted base revision and never execute code from the pull request.
      - name: Check out trusted review script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}

      - name: Review pull request with MyAgent model
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OPENCODE_API_KEY: ${{ secrets.OPENCODE_API_KEY }}
          MYAGENT_REVIEW_MODEL: deepseek-v4-flash
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node .github/scripts/ai-review.mjs
